name: APK derle
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Zip'i ac
        run: for f in *.zip; do unzip -o "$f"; done
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Derle
        run: cd ezyvpn && gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: ezyvpn-apk
          path: ezyvpn/app/build/outputs/apk/debug/app-debug.apk
