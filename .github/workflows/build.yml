name: APK derle
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Zip'i ac, projeyi bul, derle
        run: |
          for f in *.zip; do unzip -o "$f"; done
          APP=$(find . -path '*/app/build.gradle.kts' | head -1)
          echo "Bulunan: $APP"
          cd "$(dirname "$(dirname "$APP")")"
          pwd
          gradle assembleDebug --no-daemon
          mkdir -p "$GITHUB_WORKSPACE/out"
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/out/"
      - uses: actions/upload-artifact@v4
        with:
          name: ezyvpn-apk
          path: out/app-debug.apk
